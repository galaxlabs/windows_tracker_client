name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .\requirements.txt -r .\requirements-build.txt

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm .\tracker.spec

      - name: Package release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\release | Out-Null
          New-Item -ItemType Directory -Force -Path .\release\dist | Out-Null
          Copy-Item .\dist\cclms-tracker.exe .\release\dist\
          Copy-Item .\install_service.ps1 .\release\
          Copy-Item .\install_service.bat .\release\
          Copy-Item .\setup_config.ps1 .\release\
          Copy-Item .\config.example.json .\release\
          Copy-Item .\embedded_defaults.py .\release\
          Copy-Item .\version.py .\release\
          Copy-Item .\README.md .\release\
          Compress-Archive -Path .\release\* -DestinationPath .\dist\cclms-tracker-windows-x64.zip -Force

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            "tag_name=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
            "release_name=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
            "prerelease=false" >> $env:GITHUB_OUTPUT
            "make_latest=true" >> $env:GITHUB_OUTPUT
          } else {
            "tag_name=latest" >> $env:GITHUB_OUTPUT
            "release_name=Latest Development Build" >> $env:GITHUB_OUTPUT
            "prerelease=true" >> $env:GITHUB_OUTPUT
            "make_latest=false" >> $env:GITHUB_OUTPUT
          }

      - name: Delete existing rolling release assets
        if: github.ref_type != 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>$null
          exit 0

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          generate_release_notes: true
          files: |
            .\dist\cclms-tracker-windows-x64.zip
            .\dist\cclms-tracker.exe
